[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonictrace"
version = "0.1.0"
description = "SonicTrace: an explainable digital audio forensics and manipulation analysis engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SonicTrace contributors" }]
keywords = ["audio forensics", "signal processing", "splice detection", "digital forensics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sonictrace = "sonictrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonictrace = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
